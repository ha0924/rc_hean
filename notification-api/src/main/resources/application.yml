server:
  port: ${API_SERVER_PORT:8080}

spring:
  application:
    name: notification-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:notification_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:notification}
    password: ${MYSQL_PASSWORD:notification}
    driver-class-name: com.mysql.cj.jdbc.Driver

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: notification-tx-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info
